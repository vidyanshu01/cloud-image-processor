
services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudimage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudimage}
      POSTGRES_USER: ${POSTGRES_USER:-cloudimage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudimage_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudimage} -d ${POSTGRES_DB:-cloudimage}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudimage-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudimage}:${POSTGRES_PASSWORD:-cloudimage_password}@postgres:5432/${POSTGRES_DB:-cloudimage}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
      ]

volumes:
  postgres_data:
