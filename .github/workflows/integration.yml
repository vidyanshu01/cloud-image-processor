name: B2 Storage Integration Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  b2-integration:
    name: Test Backblaze B2 Storage
    runs-on: ubuntu-latest

    env:
      # Application settings
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

      # Backblaze B2 S3-compatible settings
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      AWS_REGION: ${{ secrets.B2_REGION }}
      AWS_S3_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
      AWS_S3_ENDPOINT_URL: ${{ secrets.B2_ENDPOINT_URL }}

      # Test database
      DATABASE_URL: postgresql://cloudimage_test:cloudimage_test_password@localhost:5432/cloudimage_test

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_DB: cloudimage_test
          POSTGRES_USER: cloudimage_test
          POSTGRES_PASSWORD: cloudimage_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U cloudimage_test -d cloudimage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify B2 configuration
        run: |
          python - <<'PY'
          import os

          required = [
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_REGION",
              "AWS_S3_BUCKET_NAME",
              "AWS_S3_ENDPOINT_URL",
          ]

          missing = [
              key for key in required
              if not os.getenv(key)
          ]

          if missing:
              raise SystemExit(
                  f"Missing GitHub Secrets: {', '.join(missing)}"
              )

          print("B2 configuration variables are available.")
          print(f"Region: {os.environ['AWS_REGION']}")
          print(f"Bucket: {os.environ['AWS_S3_BUCKET_NAME']}")
          print(f"Endpoint: {os.environ['AWS_S3_ENDPOINT_URL']}")
          PY

      - name: Run database migrations
        run: |
          alembic upgrade head

      - name: Run B2 integration tests
        run: |
          pytest -v -m integration